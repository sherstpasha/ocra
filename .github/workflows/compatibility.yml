name: Test Dependency Compatibility

on:
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  test-minimum-versions:
    name: Test Minimum Dependency Versions
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install minimum versions
      run: |
        python -m pip install --upgrade pip
        pip install \
          "numpy==1.21" \
          "Pillow==8.0.0" \
          "tqdm==4.65" \
          "opencv-python==4.5.0" \
          "onnxruntime==1.16.0"
        pip install -e . --no-deps
    
    - name: Test with minimum versions
      run: |
        python -c "from ocra import OrientationPredictor, HandwrittenPredictor; print('✓ Import OK')"

  test-latest-versions:
    name: Test Latest Dependency Versions
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install latest versions
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[cpu]" --upgrade
    
    - name: Test with latest versions
      run: |
        python -c "from ocra import OrientationPredictor, HandwrittenPredictor; print('✓ Import OK')"

  test-pytorch-versions:
    name: Test PyTorch Compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pytorch-version: ['2.0.1', '2.1.0', '2.2.0']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install PyTorch ${{ matrix.pytorch-version }}
      run: |
        python -m pip install --upgrade pip
        pip install torch==${{ matrix.pytorch-version }} torchvision --index-url https://download.pytorch.org/whl/cpu
    
    - name: Install package with dev dependencies
      run: |
        pip install -e ".[dev,cpu]"
    
    - name: Test training components
      run: |
        python -c "
        import torch
        print(f'PyTorch version: {torch.__version__}')
        
        from ocra.orientation.model import OrientationModel
        from ocra.ishandwritten.model import HandwrittenModel
        
        print('✓ Model imports OK')
        
        # Test model creation
        import timm
        from types import SimpleNamespace
        
        cfg = SimpleNamespace(
            model_name='mobilenetv3_small_050',
            hidden_dim=64,
            drop=0.2
        )
        
        model = OrientationModel(cfg)
        print(f'✓ OrientationModel created')
        
        # Test forward pass
        x = torch.randn(1, 3, 224, 224)
        aspect = torch.tensor([1.5])
        output = model(x, aspect)
        print(f'✓ Forward pass OK, output shape: {output.shape}')
        "

  test-onnxruntime-versions:
    name: Test ONNX Runtime Versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ort-version: ['1.16.0', '1.17.0', '1.18.0']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install ONNX Runtime ${{ matrix.ort-version }}
      run: |
        python -m pip install --upgrade pip
        pip install onnxruntime==${{ matrix.ort-version }}
        pip install -e . --no-deps
        pip install numpy Pillow tqdm opencv-python
    
    - name: Test inference
      run: |
        python -c "
        import onnxruntime as ort
        print(f'ONNX Runtime version: {ort.__version__}')
        
        from PIL import Image
        
        # Create test image
        img = Image.new('RGB', (400, 300), color='white')
        img.save('test.jpg')
        
        from ocra import OrientationPredictor, HandwrittenPredictor
        
        orient_pred = OrientationPredictor(verbose=0)
        result = orient_pred.predict_single('test.jpg')
        print(f'✓ OrientationPredictor OK: {result[\"prediction\"]}')
        
        hand_pred = HandwrittenPredictor(verbose=False)
        result = hand_pred.predict_single('test.jpg')
        print(f'✓ HandwrittenPredictor OK: {result[\"prediction\"]}')
        "
