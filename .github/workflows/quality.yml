name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort mypy
    
    - name: Check code formatting with black
      run: |
        black --check --diff src/ || true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff src/ || true
    
    - name: Lint with ruff
      run: |
        ruff check src/ --output-format=github || true
    
    - name: Type checking with mypy
      run: |
        mypy src/ocra --ignore-missing-imports || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[cpu]"
    
    - name: Security scan with pip-audit
      run: |
        pip install pip-audit
        pip-audit || true

  check-files:
    name: Check Required Files
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check required files exist
      run: |
        for file in \
          "README.md" \
          "TRAIN_README.md" \
          "QUICKSTART.md" \
          "DEVELOPMENT.md" \
          "pyproject.toml" \
          "MANIFEST.in" \
          "src/ocra/__init__.py" \
          "src/ocra/orientation/orientation_model.onnx" \
          "src/ocra/ishandwritten/handwritten_model.onnx" \
          "src/ocra/orientation/config.json" \
          "src/ocra/ishandwritten/config.json"
        do
          if [ ! -f "$file" ]; then
            echo "❌ Missing required file: $file"
            exit 1
          else
            echo "✓ Found: $file"
          fi
        done
        
        echo "✓ All required files present"
    
    - name: Check pyproject.toml syntax
      run: |
        python -m pip install --upgrade pip
        pip install toml
        python -c "
        import toml
        with open('pyproject.toml', 'r') as f:
            config = toml.load(f)
        print('✓ pyproject.toml is valid')
        print(f'Package name: {config[\"project\"][\"name\"]}')
        print(f'Version: {config[\"project\"][\"version\"]}')
        "
    
    - name: Check MANIFEST.in
      run: |
        cat MANIFEST.in
        echo "✓ MANIFEST.in checked"

  documentation:
    name: Check Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check README links
      run: |
        # Basic check for markdown syntax
        python -m pip install --upgrade pip
        pip install markdown
        
        python -c "
        import markdown
        
        for file in ['README.md', 'TRAIN_README.md', 'QUICKSTART.md', 'DEVELOPMENT.md']:
            with open(file, 'r', encoding='utf-8') as f:
                content = f.read()
                html = markdown.markdown(content)
                print(f'✓ {file} is valid markdown')
        "
    
    - name: Check for broken internal links
      run: |
        # Check for references to TRAIN_README.md, QUICKSTART.md, etc.
        grep -r "TRAIN_README.md" README.md && echo "✓ TRAIN_README.md referenced"
        grep -r "QUICKSTART.md" README.md && echo "✓ QUICKSTART.md referenced"
        echo "✓ Documentation links checked"
