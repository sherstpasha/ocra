name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[cpu]"
    
    - name: Verify no PyTorch installed
      run: |
        python -c "import sys; sys.exit(0 if 'torch' not in sys.modules else 1)"
      continue-on-error: false
    
    - name: Check PyTorch not importable
      run: |
        python -c "import sys; import importlib.util; spec = importlib.util.find_spec('torch'); sys.exit(1 if spec else 0)"
    
    - name: Test imports
      run: |
        python -c "from ocra import OrientationPredictor, HandwrittenPredictor; print('OK')"
    
    - name: Test prediction
      run: |
        python -c "from PIL import Image; Image.new('RGB', (400, 300), color='white').save('test.jpg')"
        python -c "from ocra import OrientationPredictor; p = OrientationPredictor(verbose=0); r = p.predict_single('test.jpg'); print('Prediction:', r['prediction'])"
  
  test-dev:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install PyTorch CPU
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
    
    - name: Install dev dependencies
      run: |
        pip install -e ".[dev,cpu]"
    
    - name: Test dev imports
      run: |
        python -c "import torch; print(f'PyTorch: {torch.__version__}')"
        python -c "import timm; print(f'timm: {timm.__version__}')"
        python -c "from ocra.orientation.model import OrientationModel; print('OK')"

