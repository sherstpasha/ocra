[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocra"
version = "0.2.1"
description = "ocra"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["computer-vision", "image-processing", "orientation", "rotation", "onnx", "pytorch"]
authors = [
    { name = "sherstpasha" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion"
]

# Core dependencies for inference only
dependencies = [
  "numpy>=1.21,<3",
  "Pillow>=8.0.0",
  "tqdm>=4.65",
  "opencv-python>=4.5.0"
]

# Optional dependencies
[project.optional-dependencies]
# For GPU inference
gpu = [
    "onnxruntime-gpu>=1.16.0"
]

# For CPU inference
cpu = [
    "onnxruntime>=1.16.0"
]

# For development and training
# Note: PyTorch must be installed manually based on your CUDA version
# See TRAIN_README.md for installation instructions
dev = [
    "timm>=0.9.0",
    "tensorboard>=2.4.0",
    "scikit-learn>=1.0.0",
    "onnx>=1.12.0"
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ocra*"]

[tool.setuptools.package-data]
"ocra.orientation" = ["config.json"]
"ocra.ishandwritten" = ["config.json"]

[project.urls]
Homepage = "https://github.com/sherstpasha/Ocra"
Repository = "https://github.com/sherstpasha/Ocra"
Issues = "https://github.com/sherstpasha/Ocra/issues"